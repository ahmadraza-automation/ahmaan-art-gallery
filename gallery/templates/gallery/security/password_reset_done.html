{% extends 'gallery/base.html' %}
{% block title %}Password reset email sent{% endblock %}
{% block content %}
<section class="auth-page">
  <p class="eyebrow"><span class="eyebrow-dot"></span> Your gallery account</p>
  <h1>Check your inbox.</h1>
  <p class="panel-hint">If an account matches that email address, password reset instructions have been sent.</p>
  <p class="auth-switch"><a href="{% url 'gallery:login' %}">Return to sign in</a></p>
</section>
{% endblock %}
