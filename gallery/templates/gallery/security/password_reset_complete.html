{% extends 'gallery/base.html' %}
{% block title %}Password updated{% endblock %}
{% block content %}
<section class="auth-page">
  <p class="eyebrow"><span class="eyebrow-dot"></span> Your gallery account</p>
  <h1>Password updated.</h1>

</section>
{% endblock %}
