{% with cover=artwork.images.all|first %}<div class="quick-view-layout"><div class="quick-view-image">{% if cover %}<img src="{{ cover.image.url }}" alt="{{ cover.alt_text|default:artwork.title }}">{% else %}<span class="editorial-art-fallback editorial-art-fallback--{{ artwork.category.slug }}" role="img" aria-label="{{ artwork.title }}"></span>{% endif %}</div><div class="quick-view-copy"><p class="eyebrow">{{ artwork.category.name }} · {{ artwork.artist.name }}</p><h2>{{ artwork.title }}</h2><p>{{ artwork.mood_tagline }}</p><strong>PKR {{ artwork.base_price|floatformat:0 }}</strong><a class="button-link" href="{% url 'gallery:artwork_detail' artwork.slug %}">View details &amp; options <span aria-hidden="true">↗</span></a></div></div>{% endwith %}
